<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Property & Rental Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">🏠 PropertyRental</a>
            <ul class="nav-links">
                <li><a href="index.html">Search Properties</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <div class="auth-box">
            <h2 class="auth-title">Create an Account</h2>
            <div id="alert-container"></div>
            <form id="register-form">
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label>Full Name</label>
                    <input type="text" id="fullName" class="form-control" placeholder="John Doe" required>
                </div>
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label>Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="john@example.com" required>
                </div>
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label>Phone Number</label>
                    <input type="text" id="phone" class="form-control" placeholder="9876543210" required>
                </div>
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label>Account Role</label>
                    <select id="role" class="form-control" required>
                        <option value="TENANT">Tenant (Search & Rent Properties)</option>
                        <option value="OWNER">Property Owner (List & Manage Properties)</option>
                    </select>
                </div>
                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label>Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Minimum 6 characters" required minlength="6">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Create Account</button>
            </form>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const role = document.getElementById('role').value;
            const password = document.getElementById('password').value;

            try {
                const res = await App.fetch('/auth/register', {
                    method: 'POST',
                    body: JSON.stringify({ fullName, email, phone, role, password })
                });

                App.showAlert('Registration successful! Please login.', 'success');
                setTimeout(() => window.location.href = 'login.html', 1500);
            } catch (err) {
                App.showAlert(err.message, 'danger');
            }
        });
    </script>
</body>
</html>
