<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Property & Rental Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">🏠 PropertyRental</a>
            <ul class="nav-links">
                <li><a href="index.html">Search Properties</a></li>
                <li><a href="register.html">Register</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <div class="auth-box">
            <h2 class="auth-title">User Login</h2>
            <div id="alert-container"></div>
            <form id="login-form">
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label>Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="e.g. tenant1@gmail.com" required>
                </div>
                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label>Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Sign In</button>
            </form>
            <br>
            <p style="text-align: center; font-size: 0.9rem; color: #64748b;">
                Demo Credentials:<br>
                <b>Admin</b>: admin@propertyrental.com / admin123<br>
                <b>Owner</b>: owner1@gmail.com / owner123<br>
                <b>Tenant</b>: tenant1@gmail.com / tenant123
            </p>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const res = await App.fetch('/auth/login', {
                    method: 'POST',
                    body: JSON.stringify({ email, password })
                });

                App.setSession(res.data);

                if (res.data.role === 'ADMIN') window.location.href = 'admin-dashboard.html';
                else if (res.data.role === 'OWNER') window.location.href = 'owner-dashboard.html';
                else window.location.href = 'tenant-dashboard.html';
            } catch (err) {
                App.showAlert(err.message, 'danger');
            }
        });
    </script>
</body>
</html>
